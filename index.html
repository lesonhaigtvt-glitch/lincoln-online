<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chùa Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@600;700&display=swap">
<style>html{color-scheme:dark}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Bố cục: thanh trên mỏng, chánh điện nhìn thẳng ở giữa, nút hành động và khung trò chuyện bên dưới. Giao diện tối cố định như ánh đèn trong chùa. */
:root {
  --bg: #170d08;
  --panel: #241710;
  --panel-2: #2f1e14;
  --line: #4d3322;
  --gold: #e8b960;
  --saffron: #f0a53a;
  --lotus: #ec8fa6;
  --cream: #f7ead3;
  --muted: #b99d82;
  --ok: #8fcf8a;
  --warn: #e9b35a;
  --font-display: "Cormorant Garamond", "Noto Serif", Georgia, serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--cream);
  font: 14px/1.5 var(--font-body);
  padding-block: 12px 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#app { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
h1 { margin: 0; font: 700 30px/1 var(--font-display); color: var(--gold); letter-spacing: .02em; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--cream); font-size: 13px; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.dot.live { background: var(--ok); }
.dot.solo { background: var(--muted); }
.vol { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.vol input { width: 90px; accent-color: var(--gold); }
.btn { font: inherit; background: var(--panel); color: var(--cream); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; min-height: 40px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--gold); }
.btn:focus-visible, .pick:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--gold); color: #2a1608; border-color: var(--gold); font-weight: 600; }
.btn.small { min-height: 34px; padding: 5px 12px; font-size: 13px; }
.stage { position: relative; width: min(100%, calc(64vh * 1.25)); margin: 0 auto; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #2a120b; }
canvas#cv { display: block; width: 100%; aspect-ratio: 800 / 640; touch-action: manipulation; cursor: pointer; }
#toast { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: 90%; padding: 8px 14px; border-radius: 999px; background: rgba(23,13,8,.88); border: 1px solid var(--line); color: var(--cream); font-size: 13px; text-align: center; opacity: 0; transition: opacity .25s; pointer-events: none; }
#toast.show { opacity: 1; }
#banner { position: absolute; inset: auto 12px 56px 12px; padding: 10px 14px; border-radius: 10px; background: rgba(23,13,8,.92); border: 1px solid var(--gold); color: var(--cream); text-align: center; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.act { font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 68px; min-height: 58px; padding: 8px 4px 6px; background: var(--panel); color: var(--cream); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; }
.act svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.act span { font-size: 11px; line-height: 1.1; color: var(--muted); }
.act:hover:not(:disabled) { border-color: var(--gold); }
.act:active:not(:disabled) { transform: translateY(1px); }
.act:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.act:disabled { opacity: .4; cursor: default; }
.act.hot { background: #3a2517; border-color: var(--gold); color: var(--gold); }
.act.hot span { color: var(--gold); }
.chat { width: min(100%, calc(64vh * 1.25)); margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
#log { height: 112px; overflow-y: auto; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 13px; }
#log .line { overflow-wrap: anywhere; }
#log .line b { color: var(--gold); font-weight: 600; }
#log .sys { color: var(--muted); font-style: italic; }
#chatForm { display: flex; gap: 8px; }
input[type="text"], input[type="password"] { flex: 1; min-width: 0; font: inherit; color: var(--cream); background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; min-height: 40px; }
input::placeholder { color: var(--muted); }
.entry { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(23,13,8,.74); backdrop-filter: blur(3px); overflow-y: auto; }
.card { width: 100%; max-width: 440px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.card h2 { margin: 0; font: 700 34px/1.05 var(--font-display); color: var(--gold); text-wrap: balance; }
.card p { margin: 0; color: var(--muted); }
.card label { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.picks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick { font: inherit; color: var(--cream); background: var(--panel-2); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
.pick[aria-pressed="true"] { border-color: var(--gold); background: #3a2517; }
.pick canvas { width: 96px; height: 120px; }
.note { font-size: 12px; color: var(--muted); }
#nameErr { color: var(--saffron); font-size: 13px; min-height: 1.2em; }
.rank { position: absolute; left: 8px; top: 8px; z-index: 3; width: 164px; padding: 6px 8px 7px; border-radius: 10px; background: rgba(23,13,8,.84); border: 1px solid var(--line); font-size: 12px; line-height: 1.35; }
.rankHead { font: inherit; display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 6px; padding: 2px 0; background: none; border: 0; color: var(--gold); font-weight: 600; cursor: pointer; }
.rankHead::after { content: "\25BE"; font-size: 10px; }
.rank.closed .rankHead::after { content: "\25B8"; }
.rank ol { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.rank li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 6px; padding: 1px 0; font-variant-numeric: tabular-nums; }
.rank li .rk { color: var(--muted); text-align: right; }
.rank li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank li .sc { color: var(--gold); }
.rank li.me { color: #f6d68a; font-weight: 600; }
.rank li.empty { display: block; color: var(--muted); }
#rankMe { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--line); color: var(--muted); }
.rank.closed ol, .rank.closed #rankMe { display: none; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
@media (max-width: 520px) { h1 { font-size: 26px; } .vol input { width: 70px; } }
</style>

</head>
<body>
<div id="app">
  <header>
    <h1>Chùa Online</h1>
    <div class="meta">
      <span class="pill" title="Số phật tử đang ở trong chùa">Phật tử <span id="count">0/30</span></span>
      <span class="pill"><span class="dot" id="dot"></span><span id="status">Đang kết nối</span></span>
      <button class="btn small" id="musicBtn" type="button" aria-pressed="false">Nhạc thiền: tắt</button>
      <label class="vol">Âm lượng <input id="vol" type="range" min="0" max="100" value="50"></label>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Chánh điện của chùa"></canvas>
    <div id="banner" hidden>Chùa đang đủ 30 phật tử. Bạn sẽ vào ngay khi có chỗ trống.</div>
    <div id="toast" role="status"></div>
    <aside class="rank" id="rank" aria-label="Bảng xếp hạng công đức">
      <button class="rankHead" id="rankHead" type="button" aria-expanded="true">Top 10 công đức</button>
      <ol id="rankList"></ol>
      <div id="rankMe"></div>
    </aside>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-walk" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></symbol>
  <symbol id="i-sit" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.4"/><path d="M12 8v6M8 11.5h8M4.5 19.5c2-3 4.5-3.8 7.5-3.8s5.500.8 7.500 3.800z"/></symbol>
  <symbol id="i-stand" viewBox="0 0 24 24"><circle cx="12" cy="4.500" r="2.400"/><path d="M12 7.500v7M8 10.500h8M9.500 21l2.500-6.500 2.500 6.500"/></symbol>
  <symbol id="i-bow" viewBox="0 0 24 24"><path d="M12 20c-3-1.800-5-4.800-5-8 2 0 3.800 1 5 3 1.200-2 3-3 5-3 0 3.200-2 6.200-5 8zM12 14.500c-1.200-2.800-1.200-6.300 0-10 1.200 3.700 1.200 7.200 0 10z"/></symbol>
  <symbol id="i-incense" viewBox="0 0 24 24"><path d="M8 3v9M12 2v10M16 3v9M5 14h14l-1.500 6h-11z"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><rect x="5" y="9" width="14" height="11" rx="2"/><path d="M9 9V6h6v3M9.500 13h5M12 15.500v2"/></symbol>
  <symbol id="i-mo" viewBox="0 0 24 24"><ellipse cx="10.500" cy="14" rx="7" ry="5.500"/><path d="M7.500 14.500q3 1.500 6 0M17.500 9l3-4.500M19 4l2.200 2.200"/></symbol>
</defs></svg>
  <div class="actions" id="actions">
    <button class="act" id="bWalk" type="button" title="Đi lại" aria-label="Đi lại"><svg><use href="#i-walk"/></svg><span>Đi lại</span></button>
    <button class="act" id="bSit" type="button" title="Ngồi xuống hoặc đứng lên" aria-label="Ngồi xuống"><svg><use id="sitUse" href="#i-sit"/></svg><span id="sitLabel">Ngồi</span></button>
    <button class="act" id="bBow" type="button" title="Bái lạy" aria-label="Bái lạy"><svg><use href="#i-bow"/></svg><span>Bái lạy</span></button>
    <button class="act hot" id="bIncense" type="button" title="Thắp hương, được 10 điểm công đức" aria-label="Thắp hương"><svg><use href="#i-incense"/></svg><span>Thắp hương</span></button>
    <button class="act" id="bOffer" type="button" title="Công đức vào thùng" aria-label="Công đức"><svg><use href="#i-box"/></svg><span>Công đức</span></button>
    <button class="act hot" id="bMo" type="button" title="Gõ mõ, mỗi tiếng được 1 điểm công đức" aria-label="Gõ mõ"><svg><use href="#i-mo"/></svg><span>Gõ mõ</span></button>
  </div>

  <div class="chat">
    <div id="log" aria-live="polite"></div>
    <form id="chatForm" autocomplete="off">
      <input type="text" id="msg" maxlength="80" placeholder="Nhắn một lời cho mọi người" aria-label="Tin nhắn">
      <button class="btn" type="submit">Gửi</button>
    </form>
  </div>
</div>

<div class="entry" id="entry">
  <form class="card" id="entryForm" autocomplete="off">
    <h2>Vào chánh điện</h2>
    <p>Chọn một chỗ ngồi, thắp nén hương và cùng mọi người nghe nhạc thiền. Chùa nhận tối đa 30 phật tử.</p>
    <div>
      <label for="nick">Tên hoặc pháp danh của bạn</label>
      <input type="text" id="nick" maxlength="16" placeholder="Ví dụ: Minh Tâm">
      <div id="nameErr" role="alert"></div>
    </div>
    <div>
      <label>Hình tượng</label>
      <div class="picks">
        <button class="pick" type="button" data-g="m" aria-pressed="true"><canvas width="192" height="240" data-g="m"></canvas><span>Tiểu sư phụ</span></button>
        <button class="pick" type="button" data-g="f" aria-pressed="false"><canvas width="192" height="240" data-g="f"></canvas><span>Tiểu sư cô</span></button>
      </div>
    </div>
    <button class="btn primary" type="submit">Vào chùa</button>
    <div class="note">Gửi địa chỉ trang này cho bạn bè để cùng gặp nhau trong chùa.</div>
  </form>
</div>

<script>
