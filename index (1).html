<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chùa Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@600;700&display=swap">
<style>html{color-scheme:dark}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Bố cục: thanh trên mỏng, chánh điện nhìn thẳng ở giữa, nút hành động và khung trò chuyện bên dưới. Giao diện tối cố định như ánh đèn trong chùa. */
:root {
  --bg: #170d08;
  --panel: #241710;
  --panel-2: #2f1e14;
  --line: #4d3322;
  --gold: #e8b960;
  --saffron: #f0a53a;
  --lotus: #ec8fa6;
  --cream: #f7ead3;
  --muted: #b99d82;
  --ok: #8fcf8a;
  --warn: #e9b35a;
  --font-display: "Cormorant Garamond", "Noto Serif", Georgia, serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--cream);
  font: 14px/1.5 var(--font-body);
  padding-block: 12px 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#app { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
h1 { margin: 0; font: 700 30px/1 var(--font-display); color: var(--gold); letter-spacing: .02em; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--cream); font-size: 13px; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.dot.live { background: var(--ok); }
.dot.solo { background: var(--muted); }
.vol { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.vol input { width: 90px; accent-color: var(--gold); }
.btn { font: inherit; background: var(--panel); color: var(--cream); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; min-height: 40px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--gold); }
.btn:focus-visible, .pick:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--gold); color: #2a1608; border-color: var(--gold); font-weight: 600; }
.btn.small { min-height: 34px; padding: 5px 12px; font-size: 13px; }
.stage { position: relative; width: min(100%, calc(64vh * 1.25)); margin: 0 auto; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #2a120b; }
canvas#cv { display: block; width: 100%; aspect-ratio: 800 / 640; touch-action: manipulation; cursor: pointer; }
#toast { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: 90%; padding: 8px 14px; border-radius: 999px; background: rgba(23,13,8,.88); border: 1px solid var(--line); color: var(--cream); font-size: 13px; text-align: center; opacity: 0; transition: opacity .25s; pointer-events: none; }
#toast.show { opacity: 1; }
#banner { position: absolute; inset: 12px 12px auto 12px; padding: 10px 14px; border-radius: 10px; background: rgba(23,13,8,.92); border: 1px solid var(--gold); color: var(--cream); text-align: center; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chat { width: min(100%, calc(64vh * 1.25)); margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
#log { height: 112px; overflow-y: auto; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 13px; }
#log .line { overflow-wrap: anywhere; }
#log .line b { color: var(--gold); font-weight: 600; }
#log .sys { color: var(--muted); font-style: italic; }
#chatForm { display: flex; gap: 8px; }
input[type="text"] { flex: 1; min-width: 0; font: inherit; color: var(--cream); background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; min-height: 40px; }
input::placeholder { color: var(--muted); }
.entry { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(23,13,8,.74); backdrop-filter: blur(3px); overflow-y: auto; }
.card { width: 100%; max-width: 440px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.card h2 { margin: 0; font: 700 34px/1.05 var(--font-display); color: var(--gold); text-wrap: balance; }
.card p { margin: 0; color: var(--muted); }
.card label { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.picks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick { font: inherit; color: var(--cream); background: var(--panel-2); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
.pick[aria-pressed="true"] { border-color: var(--gold); background: #3a2517; }
.pick canvas { width: 96px; height: 120px; }
.note { font-size: 12px; color: var(--muted); }
#nameErr { color: var(--saffron); font-size: 13px; min-height: 1.2em; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
@media (max-width: 520px) { h1 { font-size: 26px; } .vol input { width: 70px; } }
</style>

</head>
<body>
<div id="app">
  <header>
    <h1>Chùa Online</h1>
    <div class="meta">
      <span class="pill" title="Số phật tử đang ở trong chùa">Phật tử <span id="count">0/30</span></span>
      <span class="pill"><span class="dot" id="dot"></span><span id="status">Đang kết nối</span></span>
      <button class="btn small" id="musicBtn" type="button" aria-pressed="false">Nhạc thiền: tắt</button>
      <label class="vol">Âm lượng <input id="vol" type="range" min="0" max="100" value="50"></label>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Chánh điện của chùa"></canvas>
    <div id="banner" hidden>Chùa đang đủ 30 phật tử. Bạn sẽ vào ngay khi có chỗ trống.</div>
    <div id="toast" role="status"></div>
  </div>

  <div class="actions" id="actions">
    <button class="btn" id="bWalk" type="button">Đi lại</button>
    <button class="btn" id="bSit" type="button">Ngồi xuống</button>
    <button class="btn" id="bStand" type="button">Đứng lên</button>
    <button class="btn" id="bBow" type="button">Bái lạy</button>
    <button class="btn primary" id="bIncense" type="button">Thắp hương</button>
  </div>

  <div class="chat">
    <div id="log" aria-live="polite"></div>
    <form id="chatForm" autocomplete="off">
      <input type="text" id="msg" maxlength="80" placeholder="Nhắn một lời cho mọi người" aria-label="Tin nhắn">
      <button class="btn" type="submit">Gửi</button>
    </form>
  </div>
</div>

<div class="entry" id="entry">
  <form class="card" id="entryForm" autocomplete="off">
    <h2>Vào chánh điện</h2>
    <p>Chọn một chỗ ngồi, thắp nén hương và cùng mọi người nghe nhạc thiền. Chùa nhận tối đa 30 phật tử.</p>
    <div>
      <label for="nick">Tên hoặc pháp danh của bạn</label>
      <input type="text" id="nick" maxlength="16" placeholder="Ví dụ: Minh Tâm">
      <div id="nameErr" role="alert"></div>
    </div>
    <div>
      <label>Hình tượng</label>
      <div class="picks">
        <button class="pick" type="button" data-g="m" aria-pressed="true"><canvas width="192" height="240" data-g="m"></canvas><span>Tiểu sư phụ</span></button>
        <button class="pick" type="button" data-g="f" aria-pressed="false"><canvas width="192" height="240" data-g="f"></canvas><span>Tiểu sư cô</span></button>
      </div>
    </div>
    <button class="btn primary" type="submit">Vào chùa</button>
    <div class="note">Gửi địa chỉ trang này cho bạn bè để cùng gặp nhau trong chùa.</div>
  </form>
</div>

</script>
